<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLAG Auto Care — Customer App</title>
<link rel="preconnect" href="https://imgd.aeplcdn.com">
<link rel="preconnect" href="https://raw.githubusercontent.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=5">
</head>
<body>

<!-- ─── Device + Sidebar ───────────────────────────────────── -->
<div class="device-wrap">

  <!-- Device Shell -->
  <div class="device-shell">
    <div class="app-screen" id="appScreen">
      <div class="device-notch"></div>
      <div id="screenContainer"></div>

      <!-- Floating AI Button -->
      <div class="fab-ai" id="fabAi">
        <button class="fab-ai-btn" onclick="Router.go('aiAssistant')" title="Ask FLAG AI">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3L9.5 9.5 3 12l6.5 2.5L12 21l2.5-6.5L21 12l-6.5-2.5L12 3z"/>
          </svg>
        </button>
        <div class="fab-ai-label" onclick="Router.go('aiAssistant')">Ask FLAG AI</div>
      </div>

      <!-- Bottom Navigation: Home · Services · Bookings · Offers · Profile -->
      <nav class="bottom-nav" id="bottomNav">
        <button class="nav-item active" data-tab="home" onclick="Router.go('home')">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Home</span>
        </button>
        <button class="nav-item" data-tab="services" onclick="Router.go('services')">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          <span>Services</span>
        </button>
        <button class="nav-item" data-tab="bookings" onclick="Router.go('bookings')">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>Bookings</span>
        </button>
        <button class="nav-item" data-tab="offers" onclick="Router.go('offers')">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          <span>Offers</span>
        </button>
        <button class="nav-item" data-tab="profile" onclick="Router.go('profile')">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Profile</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- Screen Navigator Sidebar -->
  <div class="snav-panel">
    <h3>Screen Navigator</h3>
    <div class="snav-list">
      <div class="snav-group">
        <div class="snav-grp-label">Onboarding</div>
        <button onclick="Router.go('splash')">01 Splash</button>
        <button onclick="Router.go('onboarding')">02 Onboarding</button>
        <button onclick="Router.go('login')">03 Login / OTP</button>
      </div>
      <div class="snav-group">
        <div class="snav-grp-label">Vehicle Setup</div>
        <button onclick="Router.go('brandSelect')">04A Brand Select</button>
        <button onclick="Router.go('modelSelect')">04B Model Select</button>
        <button onclick="Router.go('variantSelect')">04C Variant + Details</button>
      </div>
      <div class="snav-group">
        <div class="snav-grp-label">Main</div>
        <button onclick="Router.go('home')">05 Home Dashboard</button>
        <button onclick="Router.go('services')">06 Services</button>
        <button onclick="Router.go('serviceDetail')">↳ Service Detail</button>
        <button onclick="Router.go('vehicleDashboard')">↳ Vehicle Dashboard</button>
      </div>
      <div class="snav-group">
        <div class="snav-grp-label">Booking Flow</div>
        <button onclick="Router.go('selectPackage')">07 Select Package</button>
        <button onclick="Router.go('packageDetail')">↳ Package Detail</button>
        <button onclick="Router.go('comparePackages')">↳ Compare Packages</button>
        <button onclick="Router.go('aiRecommend')">↳ AI Recommend</button>
        <button onclick="Router.go('dateTime')">08 Date &amp; Time</button>
        <button onclick="Router.go('serviceCentre')">↳ Service Centre</button>
        <button onclick="Router.go('addons')">09 Add-ons</button>
        <button onclick="Router.go('reviewBooking')">10 Review Booking</button>
        <button onclick="Router.go('payment')">11 Payment</button>
        <button onclick="Router.go('confirmation')">✅ Confirmation</button>
      </div>
      <div class="snav-group">
        <div class="snav-grp-label">Live</div>
        <button onclick="Router.go('bookings')">My Bookings</button>
        <button onclick="Router.go('tracking')">12 Live Tracking</button>
        <button onclick="Router.go('estimateApproval')">↳ Estimate Approval</button>
      </div>
      <div class="snav-group">
        <div class="snav-grp-label">Records</div>
        <button onclick="Router.go('vehicleHealth')">Vehicle Health</button>
        <button onclick="Router.go('serviceHistory')">Service History</button>
        <button onclick="Router.go('invoices')">Invoices &amp; Bills</button>
      </div>
      <div class="snav-group">
        <div class="snav-grp-label">Utility</div>
        <button onclick="Router.go('offers')">Offers &amp; Packages</button>
        <button onclick="Router.go('notifications')">Notifications</button>
        <button onclick="Router.go('aiAssistant')">FLAG AI Assistant</button>
        <button onclick="Router.go('profile')">Profile / My Garage</button>
        <button onclick="Router.go('support')">Help &amp; Support</button>
      </div>
    </div>
  </div>

</div><!-- /device-wrap -->

<!-- Load order: state first, screens second, app third -->
<script src="state.js?v=9"></script>
<script src="screens.js?v=14"></script>
<script src="app.js?v=6"></script>
</body>
</html>
